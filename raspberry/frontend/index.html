<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Estación de Control Rover - Unificada</title>
    <style>
        body {
            background-color: #0d0d12;
            color: #00ffcc;
            font-family: monospace;
            /* Activamos Grid para dividir la pantalla en dos mitades perfectas */
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 20px;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px;
            box-sizing: border-box;
        }

        /* --- MITAD IZQUIERDA: CÁMARA --- */
        #robot_feed {
            grid-column: 1;
            grid-row: 1 / span 2; /* Ocupa todo el alto del lado izquierdo */
            justify-self: end;    /* Lo pega al centro de la pantalla */
            width: 440px;
            height: 330px;
            background-color: #11111b;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
            object-fit: cover;
        }

        /* --- MITAD DERECHA: TELEMETRÍA Y STATUS --- */
        .panel {
            grid-column: 2;
            grid-row: 1;
            justify-self: start;  /* Lo pega al centro junto a la cámara */
            border: 1px solid #00ffcc;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            text-align: center;
            width: 350px;
        }
        .battery-panel {
            border: 1px dashed #00ffcc;
            background: #11111b;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .low-battery {
            border-color: #ff3333 !important;
            color: #ff3333 !important;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
            animation: parpadeo 1s infinite;
        }
        pre {
            text-align: left;
            font-size: 1.1rem;
            color: #ffffff;
            background: #161622;
            padding: 10px;
            border-radius: 4px;
            margin: 0;
        }

        /* --- MITAD DERECHA ABAJO: IMAGEN DINÁMICA --- */
        #dynamic_image {
            grid-column: 2;
            grid-row: 2;
            justify-self: start;  /* Alineada perfectamente con el panel de arriba */
            margin-left: 115px;   /* Centrado visual respecto al panel de 350px */
            border: 2px solid #00ffcc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
        }

        @keyframes parpadeo {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <img id="robot_feed" alt="[ Esperando señal de cámara... ]" class="camera-feed">

    <div class="panel">
        <h2 id="status">CONECTANDO AL ROBOT...</h2>
        
        <div id="bat_box" class="battery-panel">
            🔋 BATERÍA: <span id="bat_percent">--</span>% (<span id="bat_volts">--.--</span>V)
        </div>

        <pre id="telemetry">{ Esperando datos del mando... }</pre>
    </div>
    
    <img id="dynamic_image" src="imgs/center.jpg" alt="Status" width="120">

    <script>
        const protocolo = window.location.protocol === "https:" ? "wss://" : "ws://";
        const WS_URL = protocolo + window.location.host + "/robot";
        const IMAGE_FOLDER = "imgs/";
        
        const MAX_VEL = 1000;         
        const ZONA_MUERTA = 0.15;     
        const GIRO_THRESH = 250;      
        const EXPO_SUAVIZADO = 2.0;   

        let socket = null;
        let ultimoEnvioWS = 0; 
        const INTERVALO_WS_MS = 30;   

        function conectarWebSocket() {
            socket = new WebSocket(WS_URL);

            socket.onopen = () => {
                document.getElementById("status").innerText = "SISTEMA INTEGRADO OK";
                bucleControl();
                
                // 🔥 ACTIVACIÓN DE CÁMARA INFALIBLE:
                // Conectamos el feed directamente al endpoint de Flask de forma nativa
                document.getElementById("robot_feed").src = "/video_feed";
                console.log("📺 ¡Streaming MJPEG activado con éxito!");
            };

            socket.onmessage = (event) => {
                try {
                    const datosWeb = JSON.parse(event.data);
                    if (datosWeb.tipo === "telemetria") {
                        const porcentaje = parseInt(datosWeb.porcentaje);
                        const volts = parseFloat(datosWeb.voltaje).toFixed(2);
                        document.getElementById("bat_percent").innerText = porcentaje;
                        document.getElementById("bat_volts").innerText = volts;
                        
                        const batBox = document.getElementById("bat_box");
                        if (porcentaje <= 20) batBox.classList.add("low-battery");
                        else batBox.classList.remove("low-battery");
                    }
                } catch (e) {}
            };

            socket.onclose = () => {
                document.getElementById("status").innerText = "CONEXIÓN PERDIDA";
                document.getElementById("robot_feed").src = ""; // Apaga visor si cae la red
                setTimeout(conectarWebSocket, 2000);
            };
        }

        function bucleControl() {
            if (socket.readyState !== WebSocket.OPEN) return;

            const gamepads = navigator.getGamepads();
            const gp = Array.from(gamepads).find(g => g !== null); 

            if (gp) {
                let steer = gp.axes[0];            
                let reversa = gp.buttons[6].value;  
                let avance = gp.buttons[7].value;   

                if (Math.abs(steer) < ZONA_MUERTA) steer = 0;

                let giroSuave = Math.sign(steer) * Math.pow(Math.abs(steer), EXPO_SUAVIZADO);
                let avanceFrenado = avance - reversa; 
                let throttleSuave = Math.sign(avanceFrenado) * Math.pow(Math.abs(avanceFrenado), EXPO_SUAVIZADO);

                let throttle = throttleSuave * MAX_VEL;
                let giro = giroSuave * MAX_VEL;

                document.getElementById("telemetry").innerText = JSON.stringify({
                    "Control_Activo": gp.id,
                    "Gatillo_V": parseInt(throttle),
                    "Joystick_W": parseInt(giro)
                }, null, 2);

                actualizarImagen(throttle, giro);

                let tiempoActual = performance.now();
                if (tiempoActual - ultimoEnvioWS >= INTERVALO_WS_MS) {
                    ultimoEnvioWS = tiempoActual;
                    socket.send(JSON.stringify({ v: parseInt(throttle), w: parseInt(giro) }));
                }
            } else {
                document.getElementById("telemetry").innerText = "{ Presiona un botón en el mando para activarlo }";
            }
            requestAnimationFrame(bucleControl);
        }

        function actualizarImagen(throttle, giro) {
            const img = document.getElementById("dynamic_image");
            if (throttle === 0 && giro === 0) img.src = IMAGE_FOLDER + "center.jpg";
            else if (throttle > 0 && Math.abs(giro) < GIRO_THRESH) img.src = IMAGE_FOLDER + "forward.jpg";
            else if (throttle < 0 && Math.abs(giro) < GIRO_THRESH) img.src = IMAGE_FOLDER + "backward.jpg";
            else if (giro > GIRO_THRESH) img.src = IMAGE_FOLDER + "right.jpg";
            else if (giro < -GIRO_THRESH) img.src = IMAGE_FOLDER + "left.jpg";
        }

        conectarWebSocket();
    </script>
</body>
</html>
