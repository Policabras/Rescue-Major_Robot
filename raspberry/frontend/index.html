<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Estación de Control Rover - WebRTC Unificada</title>
    <style>
        body {
            background-color: #0d0d12;
            color: #00ffcc;
            font-family: monospace;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 20px;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px;
            box-sizing: border-box;
        }

        /* --- MITAD IZQUIERDA: VISOR DE VIDEO WEBRTC --- */
        #robot_feed {
            grid-column: 1;
            grid-row: 1 / span 2;
            justify-self: end;
            width: 440px;
            height: 330px;
            background-color: #11111b;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
            object-fit: cover;
        }

        /* --- MITAD DERECHA: PANELES --- */
        .panel {
            grid-column: 2;
            grid-row: 1;
            justify-self: start;
            border: 1px solid #00ffcc;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            text-align: center;
            width: 350px;
        }
        .battery-panel {
            border: 1px dashed #00ffcc;
            background: #11111b;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .low-battery {
            border-color: #ff3333 !important;
            color: #ff3333 !important;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
            animation: parpadeo 1s infinite;
        }
        pre {
            text-align: left;
            font-size: 1.1rem;
            color: #ffffff;
            background: #161622;
            padding: 10px;
            border-radius: 4px;
            margin: 0;
        }

        #dynamic_image {
            grid-column: 2;
            grid-row: 2;
            justify-self: start;
            margin-left: 115px;
            border: 2px solid #00ffcc;
            border-radius: 10px;
        }

        @keyframes parpadeo {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Cambiado a etiqueta <video> para soportar Audio + Video nativo sincronizado -->
    <video id="robot_feed" autoplay playsinline></video>

    <div class="panel">
        <h2 id="status">INICIANDO ENLACE WEBRTC...</h2>
        
        <div id="bat_box" class="battery-panel">
            🔋 BATERÍA: <span id="bat_percent">--</span>% (<span id="bat_volts">--.--</span>V)
        </div>

        <pre id="telemetry">{ Esperando interacción o mando... }</pre>
    </div>
    
    <img id="dynamic_image" src="imgs/center.jpg" alt="Status" width="120">

    <script>
        const IMAGE_FOLDER = "imgs/";
        const MAX_VEL = 1000;         
        const ZONA_MUERTA = 0.15;     
        const GIRO_THRESH = 250;      
        const EXPO_SUAVIZADO = 2.0;   

        let pc = null;
        let dc = null;
        let ultimoEnvioWS = 0; 
        const INTERVALO_WS_MS = 30;   

        function iniciarWebRTC() {
            if (pc) return;

            pc = new RTCPeerConnection();

            // Creamos el DataChannel para telemetría y mandos
            dc = pc.createDataChannel("mando");
            
            dc.onopen = () => {
                document.getElementById("status").innerText = "SISTEMA INTEGRADO OK";
                bucleControl();
            };

            dc.onmessage = (event) => {
                try {
                    const datosWeb = JSON.parse(event.data);
                    if (datosWeb.tipo === "telemetria") {
                        const porcentaje = parseInt(datosWeb.porcentaje);
                        const volts = parseFloat(datosWeb.voltaje).toFixed(2);
                        document.getElementById("bat_percent").innerText = porcentaje;
                        document.getElementById("bat_volts").innerText = volts;
                        
                        const batBox = document.getElementById("bat_box");
                        if (porcentaje <= 20) batBox.classList.add("low-battery");
                        else batBox.classList.remove("low-battery");
                    }
                } catch (e) {}
            };

            // Cuando llega el flujo multimedia, lo inyectamos al contenedor
            pc.ontrack = (event) => {
                document.getElementById("robot_feed").srcObject = event.streams[0];
            };

            // Solicitamos recibir video y audio del Rover
            pc.addTransceiver('video', {direction: 'recvonly'});
            pc.addTransceiver('audio', {direction: 'recvonly'});

            // Intercambio de llaves de conexión (Signaling)
            pc.createOffer().then(offer => {
                return pc.setLocalDescription(offer);
            }).then(() => {
                return fetch('/offer', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type
                    })
                });
            }).then(res => res.json())
            .then(answer => {
                return pc.setRemoteDescription(answer);
            }).catch(err => {
                console.error(err);
                document.getElementById("status").innerText = "ERROR EN ENLACE";
            });
        }

        function bucleControl() {
            if (!dc || dc.readyState !== "open") return;

            const gamepads = navigator.getGamepads();
            const gp = Array.from(gamepads).find(g => g !== null); 

            if (gp) {
                // Forzar la reproducción si el navegador bloqueó el audio de inicio
                const videoEl = document.getElementById("robot_feed");
                if (videoEl.paused) videoEl.play().catch(()=>{});

                let steer = gp.axes[0];            
                let reversa = gp.buttons[6].value;  
                let avance = gp.buttons[7].value;   

                if (Math.abs(steer) < ZONA_MUERTA) steer = 0;

                let giroSuave = Math.sign(steer) * Math.pow(Math.abs(steer), EXPO_SUAVIZADO);
                let avanceFrenado = avance - reversa; 
                let throttleSuave = Math.sign(avanceFrenado) * Math.pow(Math.abs(avanceFrenado), EXPO_SUAVIZADO);

                let throttle = throttleSuave * MAX_VEL;
                let giro = giroSuave * MAX_VEL;

                document.getElementById("telemetry").innerText = JSON.stringify({
                    "Enlace": "WebRTC P2P Datachannel",
                    "Gatillo_V": parseInt(throttle),
                    "Joystick_W": parseInt(giro)
                }, null, 2);

                actualizarImagen(throttle, giro);

                let tiempoActual = performance.now();
                if (tiempoActual - ultimoEnvioWS >= INTERVALO_WS_MS) {
                    ultimoEnvioWS = tiempoActual;
                    dc.send(JSON.stringify({ v: parseInt(throttle), w: parseInt(giro) }));
                }
            } else {
                document.getElementById("telemetry").innerText = "{ Presiona un botón en el mando para activarlo u oír el audio }";
            }
            requestAnimationFrame(bucleControl);
        }

        function actualizarImagen(throttle, giro) {
            const img = document.getElementById("dynamic_image");
            if (throttle === 0 && giro === 0) img.src = IMAGE_FOLDER + "center.jpg";
            else if (throttle > 0 && Math.abs(giro) < GIRO_THRESH) img.src = IMAGE_FOLDER + "forward.jpg";
            else if (throttle < 0 && Math.abs(giro) < GIRO_THRESH) img.src = IMAGE_FOLDER + "backward.jpg";
            else if (giro > GIRO_THRESH) img.src = IMAGE_FOLDER + "right.jpg";
            else if (giro < -GIRO_THRESH) img.src = IMAGE_FOLDER + "left.jpg";
        }

        // Activa todo con un clic en cualquier parte por seguridad del navegador
        window.addEventListener('click', () => {
            iniciarWebRTC();
            const videoEl = document.getElementById("robot_feed");
            videoEl.play().catch(()=>{});
        });

        // Iniciar enlace automáticamente
        iniciarWebRTC();
    </script>
</body>
</html>
