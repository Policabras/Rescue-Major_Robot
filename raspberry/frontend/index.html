<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wireless WebSocket Telemetry</title>
    <style>
        body {
            background-color: #0d0d12;
            color: #00ffcc;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            border: 1px solid #00ffcc;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            text-align: center;
            width: 350px;
        }
        pre {
            text-align: left;
            font-size: 1.2rem;
            color: #ffffff;
            background: #161622;
            padding: 10px;
            border-radius: 4px;
        }
        #dynamic_image {
            border: 2px solid #00ffcc;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2 id="status">CONECTANDO AL ROBOT...</h2>
        <pre id="telemetry">{ Esperando datos del mando... }</pre>
    </div>
    
    <img id="dynamic_image" src="imgs/center.jpg" alt="Status" width="150">

    <script>
        // --- REEMPLAZA LA LÍNEA DEL WS_URL CON ESTA ---
        const protocolo = window.location.protocol === "https:" ? "wss://" : "ws://";
        const WS_URL = protocolo + window.location.host + "/robot";
        const IMAGE_FOLDER = "imgs/";
        const MAX_VEL = 150;
        const ZONA_MUERTA = 0.15;

        
        let socket = null;
        let ultimoEnvioWS = 0; 
        const INTERVALO_WS_MS = 30; // Controla la tasa de envío (~33 Hz)

        function conectarWebSocket() {
            socket = new WebSocket(WS_URL);

            socket.onopen = () => {
                document.getElementById("status").innerText = "MANDO PS4 -> ALTA VELOCIDAD";
                console.log("¡Conectado por WebSocket!");
                bucleControl();
            };

            socket.onclose = () => {
                document.getElementById("status").innerText = "CONEXIÓN PERDIDA";
                setTimeout(conectarWebSocket, 2000);
            };
        }

        function bucleControl() {
            if (socket.readyState !== WebSocket.OPEN) return;

            const gamepads = navigator.getGamepads();
            const gp = gamepads[0]; 

            if (gp) {
                let steer = gp.axes[0];
                let reversa = gp.buttons[6].value; 
                let avance = gp.buttons[7].value;   

                if (Math.abs(steer) < ZONA_MUERTA) steer = 0;

                let throttle = (avance - reversa) * MAX_VEL;
                let giro = steer * MAX_VEL;

                // Mezcla diferencial
                let rpm_izq = throttle + giro;
                let rpm_der = throttle - giro;

                // Escalamiento Proporcional
                let max_actual = Math.max(Math.abs(rpm_izq), Math.abs(rpm_der));
                if (max_actual > MAX_VEL) {
                    rpm_izq = (rpm_izq / max_actual) * MAX_VEL;
                    rpm_der = (rpm_der / max_actual) * MAX_VEL;
                }

                // Render en UI (Corre a los Hz de la pantalla)
                document.getElementById("telemetry").innerText = JSON.stringify({
                    "Gatillos_T": parseInt(throttle),
                    "Joystick_G": parseInt(giro),
                    "Motor_Izq": parseInt(rpm_izq),
                    "Motor_Der": parseInt(rpm_der)
                }, null, 2);

                actualizarImagen(throttle, giro);

                // --- FILTRO DE VELOCIDAD PARA EL WEBSOCKET ---
                let tiempoActual = performance.now();
                if (tiempoActual - ultimoEnvioWS >= INTERVALO_WS_MS) {
                    ultimoEnvioWS = tiempoActual;
                    
                    socket.send(JSON.stringify({
                        izq: parseInt(rpm_izq),
                        der: parseInt(rpm_der)
                    }));
                }
            } else {
                document.getElementById("telemetry").innerText = "{ Mueve un joystick para activar el mando }";
            }

            requestAnimationFrame(bucleControl);
        }

        function actualizarImagen(throttle, giro) {
            const img = document.getElementById("dynamic_image");
            if (throttle === 0 && giro === 0) img.src = IMAGE_FOLDER + "center.jpg";
            else if (throttle > 0 && Math.abs(giro) < 40) img.src = IMAGE_FOLDER + "forward.jpg";
            else if (throttle < 0 && Math.abs(giro) < 40) img.src = IMAGE_FOLDER + "backward.jpg";
            else if (giro > 40) img.src = IMAGE_FOLDER + "right.jpg";
            else if (giro < -40) img.src = IMAGE_FOLDER + "left.jpg";
        }

        conectarWebSocket();
    </script>
</body>
</html>
