<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Estación de Control Rover - Unificada</title>
    <style>
        body {
            background-color: #0d0d12;
            color: #00ffcc;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            border: 1px solid #00ffcc;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            text-align: center;
            width: 350px;
        }
        .battery-panel {
            border: 1px dashed #00ffcc;
            background: #11111b;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .low-battery {
            border-color: #ff3333 !important;
            color: #ff3333 !important;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
            animation: parpadeo 1s infinite;
        }
        pre {
            text-align: left;
            font-size: 1.1rem;
            color: #ffffff;
            background: #161622;
            padding: 10px;
            border-radius: 4px;
            margin: 0;
        }
        #dynamic_image {
            border: 2px solid #00ffcc;
            border-radius: 10px;
            margin-top: 20px;
        }
        @keyframes parpadeo {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2 id="status">CONECTANDO AL ROBOT...</h2>
        
        <div id="bat_box" class="battery-panel">
            🔋 BATERÍA: <span id="bat_percent">--</span>% (<span id="bat_volts">--.--</span>V)
        </div>

        <pre id="telemetry">{ Esperando datos del mando... }</pre>
    </div>
    
    <img id="dynamic_image" src="imgs/center.jpg" alt="Status" width="150">

    <script>
        const protocolo = window.location.protocol === "https:" ? "wss://" : "ws://";
        const WS_URL = protocolo + window.location.host + "/robot";
        const IMAGE_FOLDER = "imgs/";
        
        const MAX_VEL = 1000;         // Escalado al nuevo rango de la ESP32
        const ZONA_MUERTA = 0.15;     // Ignora ruidos pequeños de las palancas
        const GIRO_THRESH = 250;      // Umbral para cambiar las fotos de dirección

        let socket = null;
        let ultimoEnvioWS = 0; 
        const INTERVALO_WS_MS = 30;   // Frecuencia de envío (~33 Hz)

        function conectarWebSocket() {
            socket = new WebSocket(WS_URL);

            socket.onopen = () => {
                document.getElementById("status").innerText = "MANDO EN LÍNEA (NGROK)";
                console.log("¡Conexión establecida con la Raspberry!");
                bucleControl();
            };

            // ESCUCHAR TELEMETRÍA DE BATERÍA ENVIADA POR LA PI
            socket.onmessage = (event) => {
                try {
                    const datosWeb = JSON.parse(event.data);
                    
                    if (datosWeb.tipo === "telemetria") {
                        const porcentaje = parseInt(datosWeb.porcentaje);
                        const volts = parseFloat(datosWeb.voltaje).toFixed(2);
                        
                        document.getElementById("bat_percent").innerText = porcentaje;
                        document.getElementById("bat_volts").innerText = volts;
                        
                        // Si la batería baja de 20%, el panel parpadea en rojo
                        const batBox = document.getElementById("bat_box");
                        if (porcentaje <= 20) {
                            batBox.classList.add("low-battery");
                        } else {
                            batBox.classList.remove("low-battery");
                        }
                    }
                } catch (e) {
                    console.error("Error leyendo telemetría:", e);
                }
            };

            socket.onclose = () => {
                document.getElementById("status").innerText = "CONEXIÓN PERDIDA";
                setTimeout(conectarWebSocket, 2000); // Reintento automático
            };
        }

        function bucleControl() {
            if (socket.readyState !== WebSocket.OPEN) return;

            // BUSCADOR DE CONTROL: Busca un gamepad activo en cualquier índice disponible
            const gamepads = navigator.getGamepads();
            const gp = Array.from(gamepads).find(g => g !== null); 

            if (gp) {
                let steer = gp.axes[0];            // Stick izquierdo X
                let reversa = gp.buttons[6].value;  // Gatillo L2 (0.0 a 1.0)
                let avance = gp.buttons[7].value;   // Gatillo R2 (0.0 a 1.0)

                if (Math.abs(steer) < ZONA_MUERTA) steer = 0;

                // Mapeo directo a escala 1000
                let throttle = (avance - reversa) * MAX_VEL;
                let giro = steer * MAX_VEL;

                // Verificación visual en la página web
                document.getElementById("telemetry").innerText = JSON.stringify({
                    "Control_Activo": gp.id,
                    "Gatillo_V": parseInt(throttle),
                    "Joystick_W": parseInt(giro)
                }, null, 2);

                actualizarImagen(throttle, giro);

                // Controlar flujo de datos hacia Ngrok
                let tiempoActual = performance.now();
                if (tiempoActual - ultimoEnvioWS >= INTERVALO_WS_MS) {
                    ultimoEnvioWS = tiempoActual;
                    
                    // Enviar datos en el JSON limpio que espera Python
                    socket.send(JSON.stringify({
                        v: parseInt(throttle), 
                        w: parseInt(giro)     
                    }));
                }
            } else {
                // Alerta si el navegador tiene "dormido" el control
                document.getElementById("telemetry").innerText = "{ Presiona un botón en el mando para activarlo }";
            }

            requestAnimationFrame(bucleControl);
        }

        function actualizarImagen(throttle, giro) {
            const img = document.getElementById("dynamic_image");
            if (throttle === 0 && giro === 0) {
                img.src = IMAGE_FOLDER + "center.jpg";
            } else if (throttle > 0 && Math.abs(giro) < GIRO_THRESH) {
                img.src = IMAGE_FOLDER + "forward.jpg";
            } else if (throttle < 0 && Math.abs(giro) < GIRO_THRESH) {
                img.src = IMAGE_FOLDER + "backward.jpg";
            } else if (giro > GIRO_THRESH) {
                img.src = IMAGE_FOLDER + "right.jpg";
            } else if (giro < -GIRO_THRESH) {
                img.src = IMAGE_FOLDER + "left.jpg";
            }
        }

        // Encendido inicial
        conectarWebSocket();
    </script>
</body>
</html>
