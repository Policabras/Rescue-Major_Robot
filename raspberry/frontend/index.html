<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Robot Control Panel</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #121212;
    color: white;
    margin: 0;
    height: 100vh;
    overflow: hidden;
}


.main-container {

    display: flex;
    flex-direction: row;

    height: 100vh;
    width: 100%;

}


/* =====================
   PANEL TELEMETRIA
===================== */

.left-panel {

    width: 40%;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #0d0d12;

}


.panel {

    border: 1px solid #00ffcc;

    padding: 20px;

    border-radius: 8px;

    box-shadow: 0 0 15px rgba(0,255,204,0.2);

    text-align: center;

    width: 350px;

}


#status {

    color:#00ffcc;

}


pre {

    text-align:left;

    font-size:1.2rem;

    color:white;

    background:#161622;

    padding:10px;

    border-radius:4px;

}




#dynamic_image {

    border:2px solid #00ffcc;

    border-radius:10px;

    margin-top:20px;

}



/* =====================
   PANEL CAMARA
===================== */


.right-panel {

    width:60%;

    display:flex;

    justify-content:center;

    align-items:center;

    background:black;

}



.video-container {

    width:90%;

    height:90%;

    display:flex;

    justify-content:center;

    align-items:center;

}



video {

    width:100%;

    max-width:900px;

    border:2px solid #00ff00;

    background:black;

    border-radius:8px;

}


</style>

</head>


<body>


<div class="main-container">



<!-- =====================
     TELEMETRIA
===================== -->

<div class="left-panel">


<div class="panel">


<h2 id="status">
CONECTANDO AL ROBOT...
</h2>


<pre id="telemetry">
{ Esperando datos del mando... }
</pre>


<img 
id="dynamic_image" 
src="imgs/center.jpg"
alt="Status"
width="150">


</div>


</div>





<!-- =====================
     CAMARA WEBRTC
===================== -->

<div class="right-panel">


<div class="video-container">


<video 
id="video"
autoplay
playsinline>
</video>


</div>


</div>



</div>





<script>

const pc = new RTCPeerConnection();


pc.ontrack = (event) => {

document.getElementById('video').srcObject = event.streams[0];

};



async function iniciarStreaming() {


pc.addTransceiver('video', { direction:'recvonly' });


const offer = await pc.createOffer();


await pc.setLocalDescription(offer);



const response = await fetch('/offer', {

method:'POST',

headers:{
'Content-Type':'application/json'
},


body:JSON.stringify({

sdp:pc.localDescription.sdp,

type:pc.localDescription.type

})


});



const answer = await response.json();


await pc.setRemoteDescription(

new RTCSessionDescription(answer)

);


}



window.onload = iniciarStreaming;


</script>





<script>

const WS_URL = "ws://" + window.location.host + "/robot";

const IMAGE_FOLDER = "imgs/";

const MAX_VEL = 150;

const ZONA_MUERTA = 0.15;


let socket = null;



function conectarWebSocket() {


socket = new WebSocket(WS_URL);



socket.onopen = () => {


document.getElementById("status").innerText = 
"MANDO PS4 -> ALTA VELOCIDAD";


console.log("¡Conectado por WebSocket!");


bucleControl();


};



socket.onclose = () => {


document.getElementById("status").innerText =
"CONEXIÓN PERDIDA";


setTimeout(conectarWebSocket,2000);


};


}



function bucleControl(){


if(socket.readyState !== WebSocket.OPEN)
return;



const gamepads = navigator.getGamepads();


const gp = gamepads[0];



if(gp){



let steer = gp.axes[0];


let reversa = gp.buttons[6].value;


let avance = gp.buttons[7].value;



if(Math.abs(steer)<ZONA_MUERTA)
steer=0;



let throttle = (avance-reversa)*MAX_VEL;


let giro = steer*MAX_VEL;



let rpm_izq = throttle + giro;


let rpm_der = throttle - giro;



let max_actual =
Math.max(
Math.abs(rpm_izq),
Math.abs(rpm_der)
);



if(max_actual > MAX_VEL){


rpm_izq =
(rpm_izq/max_actual)*MAX_VEL;


rpm_der =
(rpm_der/max_actual)*MAX_VEL;


}




document.getElementById("telemetry").innerText =

JSON.stringify({

"Gatillos_T":parseInt(throttle),

"Joystick_G":parseInt(giro),

"Motor_Izq":parseInt(rpm_izq),

"Motor_Der":parseInt(rpm_der)

},null,2);



actualizarImagen(throttle,giro);



socket.send(JSON.stringify({

izq:parseInt(rpm_izq),

der:parseInt(rpm_der)

}));



}



requestAnimationFrame(bucleControl);



}




function actualizarImagen(throttle,giro){


const img=document.getElementById("dynamic_image");



if(throttle===0 && giro===0)

img.src=IMAGE_FOLDER+"center.jpg";


else if(throttle>0 && Math.abs(giro)<40)

img.src=IMAGE_FOLDER+"forward.jpg";


else if(throttle<0 && Math.abs(giro)<40)

img.src=IMAGE_FOLDER+"backward.jpg";


else if(giro>40)

img.src=IMAGE_FOLDER+"right.jpg";


else if(giro<-40)

img.src=IMAGE_FOLDER+"left.jpg";

}



conectarWebSocket();


</script>


</body>
</html>
